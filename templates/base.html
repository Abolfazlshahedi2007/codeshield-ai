<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}سپر کد — CodeShield AI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  <script>
    (function() {
      var saved = localStorage.getItem('codeshield_theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var isDark = saved !== null ? saved === 'dark' : prefersDark !== false;
      document.documentElement.className = isDark ? 'dark-mode' : 'light-mode';
    })();
  </script>
  {% block extra_head %}{% endblock %}
</head>
<body class="dark-mode" id="body">
  {% block body %}{% endblock %}
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
